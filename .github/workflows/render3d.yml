name: Render Full Video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'اسم الحلقة (مثال: intro أو secrets-narcissist)'
        required: true
        default: 'intro'

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg and Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 libatk-bridge2.0-0

      - name: Ensure Browser
        run: npx remotion browser ensure

      - name: Render Full Video
        # هنا نقوم برندر الفيديو كاملاً بدون أي تقسيم
        run: npx remotion render src/index.ts "${{ inputs.composition }}" out/final.mp4 --gl=swangle --concurrency=4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: video-final
          path: out/final.mp4
