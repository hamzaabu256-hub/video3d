name: Test 5 Seconds

on:
  workflow_dispatch: # تشغيل يدوي

jobs:
  test-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install dependencies
        run: npm install

      - name: Install FFmpeg and Libs
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 libatk-bridge2.0-0

      - name: Ensure Browser
        run: npx remotion browser ensure

      - name: Render 5 seconds only
        # --frames=0-150 يعني من الإطار 0 إلى 150 (أي 5 ثوانٍ تقريباً)
        run: npx remotion render src/index.ts intro out/test.mp4 --frames=0-150 --gl=swangle

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: out/test.mp4
