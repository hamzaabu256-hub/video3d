name: Render 3D story
on:
  workflow_dispatch:
    inputs:
      composition:
        description: 'Composition id (مثال: touch-effect)'
        required: true
      chunks:
        description: 'Parallel jobs (أقصى عدد 20)'
        default: '20'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      
      - name: Install Remotion renderer and bundler
        run: npm install --no-save @remotion/bundler @remotion/renderer

      - name: Get Total Frames Automatically
        id: get_frames
        env:
          COMP: ${{ inputs.composition }}
        run: |
          cat > get-frames.js << 'EOF'
          const { bundle } = require('@remotion/bundler');
          const { getCompositions } = require('@remotion/renderer');

          (async () => {
            const compId = process.env.COMP;
            try {
              const bundled = await bundle({
                entryPoint: require.resolve('./src/index.ts'),
              });
              const compositions = await getCompositions({
                serveUrl: bundled,
                inputProps: {},
              });
              const comp = compositions.find((c) => c.id === compId);
              if (!comp) {
                console.error(`Composition "${compId}" not found.`);
                process.exit(1);
              }
              console.log(comp.durationInFrames);
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          })();
          EOF
          FRAMES=$(node get-frames.js)
          if [ -z "$FRAMES" ]; then
            echo "::error::Failed to get frames."
            exit 1
          fi
          echo "✅ Total frames: $FRAMES"
          echo "frames=$FRAMES" >> "$GITHUB_OUTPUT"

      - id: m
        env:
          TOTAL: ${{ steps.get_frames.outputs.frames }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, math, os
          total = int(os.environ["TOTAL"]); n = int(os.environ["CHUNKS"])
          size = math.ceil(total / n); items = []; i = 0
          while i * size < total:
              items.append({"idx": i, "start": i * size, "end": min(total - 1, (i + 1) * size - 1)}); i += 1
          print("matrix=" + json.dumps({"include": items}))
          EOF

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 libatk-bridge2.0-0
      - run: npx remotion browser ensure
      - name: Render chunk (video only)
        env:
          COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMP" out/part_${{ matrix.idx }}.mp4 \
            --frames=${{ matrix.start }}-${{ matrix.end }} \
            --codec=h264 --crf=18 --muted --gl=swangle \
            --concurrency=4 --timeout=300000 --log=error
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.idx }}
          path: out/part_${{ matrix.idx }}.mp4

  audio:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libpango-1.0-0 libcairo2 libatk-bridge2.0-0
      - run: npx remotion browser ensure
      - name: Render the soundtrack only
        env:
          COMP: ${{ inputs.composition }}
        run: |
          mkdir -p out
          npx remotion render src/index.ts "$COMP" out/audio.mp3 --codec=mp3 --log=error || echo "no audio produced"
      - uses: actions/upload-artifact@v4
        with:
          name: audio
          path: out/audio.mp3
          if-no-files-found: ignore

  assemble:
    needs: [render, audio]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: audio
          path: sound
      - name: Join and add sound
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          cd parts
          ls part_*.mp4 | sort -V | sed "s/^/file '/; s/$/'/" > list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../video_only.mp4
          cd ..
          if [ -f sound/audio.mp3 ]; then
            ffmpeg -y -i video_only.mp4 -i sound/audio.mp3 -map 0:v -map 1:a -c:v copy -c:a aac -b:a 192k -shortest final.mp4
          else
            cp video_only.mp4 final.mp4
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final.mp4
