name: Render Dopamine Final

on:
  workflow_dispatch: # تشغيل يدوي

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm1 libcups2 libatk-bridge2.0-0 libpango-1.0-0 libcairo2
          
      - name: Install Python & Audio Libraries
        run: |
          pip install edge-tts gTTS numpy requests

      - name: Install Node Dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure Browser
        run: npx remotion browser ensure

      - name: Create Story File (Dopamine Topic)
        run: |
          mkdir -p src/story/episodes/dopamine
          cat > src/story/episodes/dopamine/story.json << 'EOF'
          {
            "title": "حلقة الدوبامين: كيف تدمن ما يؤذيك؟",
            "subtitle": "أسرار النفس",
            "hook": "لماذا لا تستطيع ترك هاتفك؟",
            "outro": "تحكم في عقلك",
            "set": "studio",
            "music": "calm",
            "captions": true,
            "transition": "fade",
            "entrance": true,
            "characters": {
              "host": {
                "name": "راوي أسرار النفس", "voice": "ar-EG-ShakirNeural", "rate": "+5%", "pitch": "+0Hz",
                "color": "#ffd166", "scale": 0.9,
                "spec": {"skin": "#f2c9a0", "shirt": "#173f68", "pants": "#202b42", "hair": "#30251f", "glasses": false, "tie": "#d9a441"}
              },
              "expert": {
                "name": "خبيرة نفسية", "voice": "ar-EG-SalmaNeural", "rate": "+0%", "pitch": "+0Hz",
                "color": "#06d6a0", "scale": 0.9,
                "spec": {"skin": "#f2c9a0", "shirt": "#ef476f", "pants": "#202b42", "hair": "#30251f", "glasses": true}
              }
            },
            "lines": [
              {"who": "host", "anim": "point", "emotion": "curious", "shot": "close",
               "text": "لماذا لا تستطيع ترك هاتفك، رغم أنك تشعر بالملل والتوتر؟"},
              {"who": "expert", "anim": "talk", "emotion": "surprised", "shot": "medium",
               "text": "عقلك يقع في فخ يُسمى حلقة الدوبامين. كل إشعار أو تمريرة جديدة تطلق جرعة صغيرة من هرمون المتعة."},
              {"who": "host", "anim": "think", "emotion": "thoughtful", "shot": "wide",
               "text": "المشكلة أن هذه المكافأة غير متوقعة، تماماً مثل ماكينة القمار، مما يجعلك تدمن البحث عن المزيد."},
              {"who": "expert", "anim": "talk", "emotion": "neutral", "shot": "medium",
               "text": "لتحطيم هذه الحلقة، لا تلوم إرادتك، بل غير بيئتك: أغلق الإشعارات، وضع الهاتف بعيدا أثناء النوم."},
              {"who": "host", "anim": "shrug", "emotion": "happy", "shot": "orbit",
               "text": "اضغط لايك واشترك في أسرار النفس لتتعلم كيف تتحكم بعقلك، وليس العكس!"}
            ]
          }
          EOF

      - name: Generate Audio & Register Episode
        # هذا السكربت هو سري، سيقوم بتوليد الصوت وتسجيل الحلقة في النظام تلقائياً
        run: python3 tools/build_story.py dopamine

      - name: Render Video
        run: npx remotion render src/index.ts dopamine out/final.mp4 --gl=swangle

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: dopamine-video
          path: out/final.mp4
