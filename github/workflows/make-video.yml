name: Make video 3

on:
  workflow_dispatch:
    inputs:
      episode:
        description: "اسم الحلقة"
        default: "ep-4"
      format:
        description: "vertical او 16x9"
        default: "vertical"
      scale:
        description: "0.5 سريع (540x960) او 1 جودة كاملة (1080x1920)"
        default: "0.5"
      jobs:
        description: "عدد المهام المتوازية (حتى 20)"
        default: "20"
      require_edge:
        description: "1 = صوت edge-tts اولا، 0 = السماح بالصوت البديل. (لو فشل الصوت كله يتم تخطيه ويتولد الفيديو بدون صوت)"
        default: "1"
      topic:
        description: "موضوع الفيديو ليكتب Gemini السكربت (او auto). فارغ = استخدم story.json الموجود أو ولد تلقائياً"
        default: ""
      gemini_model:
        description: "اسم نموذج Gemini (اختياري، فارغ = اختيار تلقائي)"
        default: ""

permissions:
  contents: write

env:
  EP: ${{ inputs.episode }}
  FORMAT: ${{ inputs.format }}
  SCALE: ${{ inputs.scale }}
  JOBS: ${{ inputs.jobs }}

jobs:
  voice:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total: ${{ steps.plan.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -U edge-tts gTTS numpy

      - name: Write script with Gemini (Auto or Manual)
        run: |
          if [ "${{ inputs.topic }}" != "" ] || [ ! -f "src/story/episodes/$EP/story.json" ]; then
            echo "توليد السكربت..."
            python3 tools/gen_story.py
          else
            echo "الملف موجود مسبقاً، سيتم تخطي التوليد واستخدام الملف الحالي."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          MODEL: ${{ inputs.gemini_model }}

      - name: Save script to repo
        run: |
          if [ -f "src/story/episodes/$EP/story.json" ]; then
            git config user.name "video-bot"
            git config user.email "bot@users.noreply.github.com"
            git add "src/story/episodes/$EP/story.json"
            git commit -m "script for $EP" || echo "nothing to commit"
            git push || echo "push skipped"
          fi

      - name: Verify story.json exists
        run: |
          if [ ! -f "src/story/episodes/$EP/story.json" ]; then
            echo "❌ خطأ: ملف story.json غير موجود!"
            exit 1
          fi

      - name: Build voice, music and sfx (with fallback)
        run: |
          set +e
          mkdir -p "public/episodes/$EP"

          REQUIRE_EDGE="${{ inputs.require_edge }}" python3 tools/build_story.py "$EP"
          rc=$?

          if [ $rc -ne 0 ] && [ "${{ inputs.require_edge }}" = "1" ]; then
            echo "::warning::فشل صوت edge-tts، محاولة ثانية مع السماح بالصوت البديل"
            REQUIRE_EDGE=0 python3 tools/build_story.py "$EP"
            rc=$?
          fi

          if [ $rc -ne 0 ]; then
            echo "::warning::تعذر توليد الصوت، سيتم تخطيه مؤقتاً وتوليد الفيديو بدون صوت"
            rm -f "public/episodes/$EP/voice.wav"
            python3 tools/build_story.py "$EP" --dry
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "❌ فشل حتى التوليد التجريبي (dry) لملف timeline"
              exit 1
            fi
          fi

          if [ ! -f "src/story/episodes/$EP/timeline.json" ]; then
            echo "❌ timeline.json غير موجود"
            exit 1
          fi
          if [ ! -f "public/episodes/$EP/voice.wav" ]; then
            echo "::warning::لا يوجد voice.wav، سيخرج الفيديو بدون صوت الحوار"
          fi
          exit 0

      - name: Fill missing timelines of other episodes
        run: |
          for d in src/story/episodes/*/; do
            n=$(basename "$d")
            if [ -f "$d/story.json" ] && { [ ! -f "$d/timeline.json" ] || [ ! -f "$d/mouth.json" ]; }; then
              echo "dry build for $n"
              python3 tools/build_story.py "$n" --dry || echo "dry failed for $n"
            fi
          done

      - name: Update registry
        run: python3 tools/gen_registry.py

      - name: Plan chunks
        id: plan
        run: |
          python3 - <<'PY'
          import json, os
          ep = os.environ["EP"]
          tl = json.load(open("src/story/episodes/" + ep + "/timeline.json"))
          n = tl["total"]
          k = max(1, min(20, int(os.environ["JOBS"])))
          size = -(-n // k)
          m = [{"i": i, "a": a, "b": min(a + size, n) - 1} for i, a in enumerate(range(0, n, size))]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps(m) + "\n")
              f.write("total=" + str(n) + "\n")
          print("frames:", n, "chunks:", len(m))
          PY

      - name: Pack assets
        run: |
          mkdir -p "public/episodes/$EP"
          tar czf assets.tgz "public/episodes/$EP" "src/story/episodes/$EP" src/story/registry.ts
      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets.tgz

  thumb:
    needs: voice
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
      - run: tar xzf assets.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
      - run: npm install --no-audit --no-fund
      - run: npx remotion still src/index.ts "$EP-thumb" thumb.png --gl=swangle --timeout=180000
      - uses: actions/upload-artifact@v4
        with:
          name: thumb
          path: thumb.png

  render:
    needs: voice
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.voice.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: assets
      - run: tar xzf assets.tgz
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: System libs
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-color-emoji libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
      - run: npm install
